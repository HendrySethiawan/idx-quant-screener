# ------------------------------------------------------------------------- data
# Needs to exceed 13 months so 12-month momentum has history. The old code used
# data_retention_days (30) here, which capped every series at ~30 bars.
history_period: "2y"
cache_ttl_minutes: 60

technical:
  ma_periods: [5, 20]
  rsi_window: 14
  bb_window: 20
  vol_window: 60
  liquidity_window: 20

# ---------------------------------------------------------------------- scoring
fundamental_metrics:
  - pe_ratio
  - price_to_book
  # dividend_yield is NOT here: it is computed from the dividends actually paid,
  # in analysis/technical.trailing_dividend_yield, and arrives with the price
  # factors rather than from the fundamentals snapshot.
  - beta
  - roe
  - gross_margin
  - debt_to_equity

scoring_method: zscore_normalized

# Sign encodes direction: higher composite = more attractive.
# `beta` is intentionally NOT here. yfinance reports 0.016 for Bank Mandiri and
# negative betas for several IDX large caps; realized_vol replaces it.
factor_weights:
  pe_ratio: -1.0          # cheaper is better
  price_to_book: -1.0
  dividend_yield: 1.0
  roe: 1.0                # quality, scored within sector
  gross_margin: 1.0
  debt_to_equity: -1.0
  realized_vol: -0.5      # prefer calmer names
  mom_1m: 0.5             # short horizon matters for weekly trading
  mom_6m: 1.0
  mom_12m: 1.0

# |x| beyond the bound is a data glitch -> NaN -> neutral contribution.
# price_to_book catches the PTRO (179,615) / BRPT (77,600) class of error that
# previously flattened the whole factor.
sanity_bounds:
  dividend_yield: 0.15
  price_to_book: 20.0
  roe: 3.0
  gross_margin: 1.5
  debt_to_equity: 2000.0
  pe_ratio: 200.0

sector_neutral_factors:
  - roe
  - gross_margin
  - debt_to_equity
min_sector_size: 4
winsorize_k: 5.0

# Peer-multiple fair value. This is the only part of the tool that answers "what is
# it worth"; `factor_weights` above answers "where does it rank", which is a
# different question -- undervaluation_score is min-max normalised, so one stock
# always scores 1.0 even in a bubble.
#
# Two estimates per name, from data already fetched:
#   EPS  = price / P/E   ->  fair price = EPS  x peer median P/E
#   BVPS = price / P/B   ->  fair price = BVPS x peer median P/B
# The fair zone is the gap BETWEEN them, so a name whose measures agree gets a
# tight zone and one whose measures fight gets a wide one. No invented threshold.
valuation:
  enabled: true
  min_peers: 4            # smaller sector -> use the whole universe, and say so
  wide_band_pct: 0.60     # wider disagreement than this is reported, not averaged

max_per_sector: 2
top_picks_n: 8
risk_adjusted: false

# ------------------------------------------------------------------ broker fees
# Indopremier. The stamp is charged once per DAY containing at least one sell,
# not per order -- batching sells into a single day is worth real money.
broker:
  buy_fee: 0.0019
  sell_fee: 0.0029
  stamp_duty_rp: 10000
  lot_size: 100

account:
  # PLACEHOLDER. This file is public -- put your real capital in configs/user.yaml
  # (git-ignored), which is applied on top of this one:
  #
  #   account:
  #     capital_rp: 25000000
  #
  # Position sizing, the minimum-position floor and the fee percentages all scale
  # from this number, so it is worth setting accurately.
  capital_rp: 100000000
  min_positions: 3
  max_positions: 6
  max_lot_to_slot: 1.0
  deviation_penalty: 0.5
  min_position_rp: 1000000   # below this, the Rp10k stamp dominates the trade
  holdings_path: current_holdings.yaml
  journal_path: data/journal.csv
  marks_path: data/journal_marks.csv
  min_trades_for_verdict: 30   # below this the report refuses to name a winner

# IDX market rules. BEI changes these; that is why they are here and not in code.
# The minimum tradable price is moving Rp50 -> Rp1 (tested 22 & 29 Aug 2026,
# targeted 7 Sept 2026). When it lands, change min_price_rp and nothing else.
#
# A price pinned at the floor cannot fall, and a suspended one cannot move at all.
# Neither is "calm", but both measure as zero volatility -- and realized_vol is
# scored at -0.5, "prefer calmer names". Above these thresholds the affected
# factors are scored neutral instead of favourable.
market:
  min_price_rp: 50
  max_flat_pct: 0.60      # share of sessions with no price change
  max_floor_pct: 0.20     # share of sessions at the minimum price

# Subtracted before every Sharpe. Roughly the BI 7-day reverse repo rate.
risk_free_pct: 5.5

# ---------------------------------------------------------------------- exits
# When to get out, and in how many pieces. Measured on the cached universe --
# 1,705 simulated entries across 46 tradable names, 42-session horizon:
#
#   rule                     stopped out within 2 months   median sessions held
#   2.0 x ATR fixed at entry            51%                        23
#   2.5 x ATR fixed at entry            44%                        27
#   3.0 x ATR fixed at entry            39%                        31
#   2.0 x ATR trailing                  82%                        13
#   2.5 x ATR trailing                  74%                        16
#   3.0 x ATR trailing                  66%                        20
#
# Trailing the WHOLE position from entry fires on two thirds to four fifths of
# entries within two months. Each firing costs about Rp22,000 at Rp10 juta (stamp
# + 0.29% out + 0.19% back in) -- roughly Rp700,000 a year across four slots. So
# the stop is fixed until the first trim banks a gain, and only the runner trails.
#
# A stop distance cannot be a percentage here: 2.5 x ATR is 3.0% on BBSI and
# 16.8% on INET. Scaling by the name's own ATR is also what makes this adapt --
# when the market turns violent the ATR rises and the stop widens by itself.
#
# WHETHER THE LADDER PAYS FOR ITSELF DEPENDS ON HOW OFTEN YOU RE-RANK. Over 5
# years on the 74-name universe:
#
#   WEEKLY                      CAGR      maxDD    Sharpe
#     Hold to the rebalance    +34.5%    -31.6%     1.16
#     Stop only, 2.5 x ATR     +33.8%    -19.5%     1.30
#     Stop + ladder (shipped)  +31.1%    -10.7%     1.61   <- best risk-adjusted
#
#   MONTHLY
#     Hold to the rebalance    +31.7%    -30.7%     0.98
#     Stop only, 2.5 x ATR     +37.9%    -25.8%     1.09   <- best risk-adjusted
#     Stop + ladder (shipped)  +21.3%    -16.7%     0.80
#
# At 1-2 trades a week the weekly row is the one that describes this account, and
# there the ladder gives up 3.4 points of return for a drawdown a third the size.
#
# This reversed when the universe grew from 49 names to 74: on the narrower list
# the ladder lost at both cadences. More sectors means more independent trends, so
# trimming one winner no longer removes the whole edge. Re-run --backtest after any
# universe change -- these are measurements, not constants.
#
# To keep the stop and drop the trims, put this in configs/user.yaml:
#     risk:
#       ladder: []
#       ladder_fractions: []
risk:
  atr_window: 14
  k_atr: 2.5
  ladder: [1.0, 2.0]          # trim levels in multiples of R = entry - stop
  ladder_fractions: [0.4, 0.3]  # share of the ORIGINAL position sold at each
  trail_after_stage: 1        # the runner trails once stage 1 has banked
  trigger: close              # never the intraday low; there is no live feed
  max_stop_pct: 15.0          # wider than this is a shrug, not a stop
  # Set by the stamp, not by taste: 10,000 / (0.025 - 0.0029) puts the smallest
  # viable trim at about Rp452,000. Below that the Rp10,000 dominates -- one lot
  # of a Rp179,500 position costs Rp10,520 to sell alone, 5.9% of what it returns.
  max_trim_cost_pct: 2.5
  max_position_risk_pct: 2.0  # warned about, not enforced -- sizing is unchanged
  cooldown_sessions: 10       # no re-buy this soon after selling

# A position must be exitable in roughly one session.
liquidity:
  max_position_pct_of_daily_value: 0.01
  min_median_daily_value_rp: 250000000
  window: 20

regime:
  trend_ma: 200
  benchmark: "^JKSE"
  fx_ticker: "IDR=X"
  deploy_ladder: [0.30, 0.60, 1.00]   # by count of risk-on signals (0, 1, 2)

# ------------------------------------------------------------------- backtest
# Only momentum + realized_vol are reconstructible from history (3.0 of the 9.0
# total factor weight). The fundamentals are yfinance snapshots, so using them
# historically would be look-ahead. See docs/AUDIT.md.
backtest:
  history_period: "5y"
  rebalances: [M, W]
  min_names: 10

events_path: configs/events.yaml
event_horizon_days: 14

# ----------------------------------------------------------------------- ml off
# The ranker labels y = (score > median of that same score), then overwrites the
# score with its own prediction. That is circular, and on a ~49-name cross-section
# it adds nothing. Left in the tree, switched off.
use_ml: false
ml:
  features:
    - pe_ratio
    - price_to_book
    - dividend_yield
    - rsi_14
    - ma5_slope
    - ma20_slope
  walk_forward_splits: 3
