# configs/default.yaml --revision 2
#
# App-managed overrides live in configs/user.yaml (git-ignored) and are applied
# AFTER this file. This file is never rewritten by the tool, so the comments below
# stay intact.

# --------------------------------------------------------------------- universe
# 74 IDX names. Nothing outside this list can ever be suggested, so what defines
# it matters as much as what is in it.
#
# THE RULE, and it is deliberately blind to what a price did:
#
#   * traded at least Rp250 juta a day (the `liquidity` gate below -- can you get
#     back out?)
#   * one lot costs at most Rp1,000,000, which is the slot at Rp10 juta capital in
#     a RISK-OFF regime. ITMG and UNTR fail this and are kept anyway: they are real
#     large caps, reachable at full deploy.
#   * at least 273 sessions of history -- 252 + 21, the minimum for 12-month
#     momentum
#   * a measurable ATR, or no stop can be set for it
#   * at least 5 names per sector, so `min_sector_size` below is reachable and the
#     sector-neutral factors are scored against peers instead of silently falling
#     back to the whole universe
#   * ties broken by traded value, never by return
#
# NOT used: past return, momentum, market cap, or an opinion of the business. The
# backtest already reports that holding these names equally beat the index by ~28
# points a year, and that gap is an artifact of the list having been drawn in 2026
# knowing who survived. Choosing the universe on performance would inflate that
# artifact and call it skill. See README, "The universe and how it was chosen".
#
# Removed in this revision, all for failing the liquidity gate on every run:
#   WIKA (Rp0/day traded, 98% flat sessions, no ATR), ADHI (Rp0/day),
#   BBSI (Rp2.3 juta/day), BTPN (Rp56 juta/day), BNLI (Rp116 juta/day).
